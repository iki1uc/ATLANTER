<!DOCTYPE html>

<body>

<h1>☕ uOUR · OURu · <span class="kick">698869</span></h1>

  <h2>⚡ Orbit‑Engine</h2>

</div>

  <pre id="axiom"></pre>

<div class="panel">
  <h2>📦 Module‑Output (A–Z)</h2>
  <pre id="modules"></pre>
</div>

<script type="importmap">
{
  "imports": {
    "./A.js": "./A.js",
    "./B.js": "./B.js",
    "./C.js": "./C.js",
    "./D.js": "./D.js",

    "./F.js": "./F.js",
    "./G.js": "./G.js",
    "./H.js": "./H.js",

    "./L.js": "./L.js",
    "./P.js": "./P.js",
    "./V.js": "./V.js",
    "./Highway-Axiom.js": "./Highway-Axiom.js",
    "./Komplettum-Axiom.js": "./Komplettum-Axiom.js",
    "./ME-Axiom.js": "./ME-Axiom.js",
    "./Operator-Axiom.js": "./Operator-Axiom.js",
    "./RAD-Axiom.js": "./RAD-Axiom.js",
    "./Scan-Axiom.js": "./Scan-Axiom.js",
    "./Slalom-Axiom.js": "./Slalom-Axiom.js",
    "./Phi-Axiom.js": "./Phi-Axiom.js",

    "./flag.vector.js": "./flag.vector.js",
    "./698869.js": "./698869.js"
  }
}
</script>

<script type="module">

  // ─── 1. MODULE A–Z ──────────────────────────────────
  import { A } from "./A.js";
  import { B } from "./B.js";
  import { C } from "./C.js";
  import { D } from "./D.js";
  import { E } from "./E.js";
  import { F } from "./F.js";
  import { G } from "./G.js";
  import { H } from "./H.js";
  import { K } from "./K.js";
  import { L } from "./L.js";
  import { P } from "./P.js";
  import { V } from "./V.js";

  // ─── 2. AXIOME ──────────────────────────────────────
  import { HighwayAxiom } from "./Highway-Axiom.js";
  import { KomplettumAxiom } from "./Komplettum-Axiom.js";
  import { MEAxiom } from "./ME-Axiom.js";
  import { OperatorAxiom } from "./Operator-Axiom.js";
  import { RADAxiom } from "./RAD-Axiom.js";
  import { ScanAxiom } from "./Scan-Axiom.js";
  import { SlalomAxiom } from "./Slalom-Axiom.js";
  import { PhiAxiom } from "./Phi-Axiom.js";
  import { IORAxiom } from "./IOR-Axiom.js";
  import { FlagAxiom } from "./flag.vector.js";

  // ─── 3. DREIECK ─────────────────────────────────────
  import { Axiom698869 } from "./698869.js";

  // ─── 4. ALLE MODULE ────────────────────────────────
  const modules = [A, B, C, D, E, F, G, H, K, L, P, V];

  // ─── 5. TICK ────────────────────────────────────────
  function tick() {

    modules.forEach(m => {
      m.TICK++;
      m.VALUE++;
      m.RADIUS = Math.sqrt(m.VALUE * m.VALUE + m.TICK);
      m.ORBIT = Math.sin(m.TICK / 10) * m.RADIUS;
    });

    document.getElementById("orbit").innerText =
      "A: " + A.VALUE + " | R=" + A.RADIUS + " | O=" + A.ORBIT + "\n" +
      "B: " + B.VALUE + " | R=" + B.RADIUS + " | O=" + B.ORBIT + "\n" +
      "C: " + C.VALUE + " | R=" + C.RADIUS + " | O=" + C.ORBIT;

    document.getElementById("axiom").innerText =
      JSON.stringify({
        highway: HighwayAxiom,
        komplettum: KomplettumAxiom,
        me: MEAxiom,
        operator: OperatorAxiom,
        rad: RADAxiom,
        scan: ScanAxiom,
        slalom: SlalomAxiom,
        phi: PhiAxiom,
        ior: IORAxiom,
        flag: FlagAxiom,
        ax698869: Axiom698869
      }, null, 2);

    let out = "";
    modules.forEach(m => {
      out += m.NAME + ": " + m.VALUE + " | R=" + m.RADIUS + " | O=" + m.ORBIT + "\n";
    });
    document.getElementById("modules").innerText = out;
  }

  setInterval(tick, 1000);

</script>

</body>
</html>
